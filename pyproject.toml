[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dataease-skill"
version = "2.1.1"
description = "DataEase V2 CLI — safe exploration, modeling, visualization and platform management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DataEase Skill Team"}]
keywords = ["dataease", "bi", "data-visualization", "dashboard", "datav"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cryptography>=45.0.0",
    "PyJWT>=2.10.0",
    "requests>=2.32.0",
]

[project.scripts]
dataease = "dataease_skill.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["dataease_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
